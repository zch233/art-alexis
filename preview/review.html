<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Art Alexis · 设计评审</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeaf2;color:#21132f;font:15px/1.6 system-ui,sans-serif}header{padding:20px 28px;background:#fff}h1{font-size:22px;margin:0}p{margin:8px 0}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}a,button{font:inherit;color:inherit;border:1px solid #85778f;background:transparent;padding:9px 16px;text-decoration:none;cursor:pointer}button.active{background:#241337;color:white}.boards{display:flex;gap:28px;padding:24px;align-items:flex-start;overflow:auto}.board{flex-shrink:0}.label{margin-bottom:10px}iframe{border:0;background:#190e30;height:850px;display:block}.desktop iframe{width:1100px}.mobile iframe{width:390px}.note{max-width:100ch;color:#55475f}button:focus-visible,a:focus-visible{outline:3px solid #653793}@media(max-width:800px){.desktop{display:none}.boards{padding:16px}.mobile iframe{width:min(390px,calc(100vw - 32px))}}</style></head><body><header><h1>Art Alexis · 页面设计确认 v1</h1><p class="note">桌面与手机使用同一套响应式页面。此稿确认布局与浏览结构，尚未接入 WordPress、上传、完整缩放手势或生产 GSAP 动效。四张图均为客户真实作品；Untitled 和邮箱待替换。</p><nav><button data-page="home" class="active">首页</button><button data-page="about">About</button><button data-page="work">Work</button><button data-page="collection">分类列表</button><button data-page="artwork">作品详情</button><a id="direct" href="index.html" target="_blank" rel="noopener">独立打开 ↗</a><a href="../docs/requirements.md">需求规格</a></nav></header><div class="boards"><section class="board desktop"><div class="label">桌面 · 1100 px（可在独立页查看更宽尺寸）</div><iframe title="桌面设计预览" src="index.html"></iframe></section><section class="board mobile"><div class="label">手机 · 390 px</div><iframe title="手机设计预览" src="index.html"></iframe></section></div><script>document.querySelectorAll('button[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const url='index.html?page='+b.dataset.page;document.querySelectorAll('iframe').forEach(f=>f.src=url);document.querySelector('#direct').href=url});</script></body></html>
